name: Build LinkiGSI 15

on:
  workflow_dispatch:
    inputs:
      gsi_url_arm64:
        description: 'URL базы arm64 AB (телефоны)'
        required: false
        default: 'https://dl.google.com/developers/android/vic/images/gsi/aosp_arm64-exp-BP11.241210.004-12926906-ac28fd4c.zip'
      gsi_url_x64:
        description: 'URL базы x86_64 AB (виртуалка)'
        required: false
        default: 'https://dl.google.com/developers/android/vic/images/gsi/aosp_x86_64-exp-BP11.241210.004-12926906-4944ba98.zip'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y simg2img erofs-utils xz-utils unzip e2fsprogs

      - name: Download Google GSI 15 base
        run: |
          mkdir -p base/arm64 base/x64 out
          cd base/arm64
          echo "Качаем arm64 (телефоны)..."
          wget -O arm64.zip "${{ inputs.gsi_url_arm64 }}" || echo "ARM64_URL_FAIL=1" >> $GITHUB_ENV
          unzip -o arm64.zip || true
          ls -lh
          find . -type f | head -n20
          cd ../x64
          echo "Качаем x64 (виртуалка)..."
          wget -O x64.zip "${{ inputs.gsi_url_x64 }}" || echo "X64_URL_FAIL=1" >> $GITHUB_ENV
          unzip -o x64.zip || true
          ls -lh
          find . -type f | head -n20
          cd ../..

      - name: Rebrand arm64 to LinkiGSI
        if: env.ARM64_URL_FAIL != '1'
        run: |
          chmod +x scripts/rebrand.sh
          IMG=$(find base/arm64 -type f -name "*.img" | grep -iv "vbmeta\|boot" | head -n1)
          # если оба архива распаковались в одну папку - берем первый большой (>1G это system)
          if [ -z "$IMG" ]; then ls -R base; exit 1; fi
          echo "База: $IMG"
          simg2img "$IMG" raw.img || cp "$IMG" raw.img
          mkdir -p mnt unpacked
          sudo mount -o ro raw.img mnt
          sudo cp -a mnt/. unpacked/
          sudo umount mnt
          sudo chown -R $USER:$USER unpacked
          ./scripts/rebrand.sh ./unpacked
          # перепаковка в erofs (грузится как и оригинал)
          sudo mkfs.erofs -z lz4 out/LinkiGSI-15-arm64-ab.img unpacked/
          rm -rf unpacked mnt raw.img
          ls -lh out/

      - name: Rebrand x64 to LinkiGSI (виртуалка)
        if: env.X64_URL_FAIL != '1'
        run: |
          IMG=$(find base/x64 -type f -name "*.img" | grep -iv "vbmeta\|boot" | head -n1)
          if [ -z "$IMG" ]; then ls -R base/x64; exit 1; fi
          echo "База: $IMG"
          simg2img "$IMG" raw64.img || cp "$IMG" raw64.img
          mkdir -p mnt64 unpacked64
          sudo mount -o ro raw64.img mnt64
          sudo cp -a mnt64/. unpacked64/
          sudo umount mnt64
          sudo chown -R $USER:$USER unpacked64
          ./scripts/rebrand.sh ./unpacked64
          sudo mkfs.erofs -z lz4 out/LinkiGSI-15-x86_64-ab.img unpacked64/
          rm -rf unpacked64 mnt64 raw64.img
          ls -lh out/

      - name: Upload LinkiGSI
        uses: actions/upload-artifact@v4
        with:
          name: LinkiGSI-15
          path: out/
